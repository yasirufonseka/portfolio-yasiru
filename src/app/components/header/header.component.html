<header class="site-header" [class.is-scrolled]="scrolled()" [class.menu-is-open]="menuOpen()">
  <div class="container header-inner">
    <a class="brand" href="#top" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">YF</span>
      <span class="brand-text">
        <span class="brand-name">Yasiru Fonseka</span>
        <span class="brand-role">Aspiring Software Engineer</span>
      </span>
    </a>

    <nav class="nav" aria-label="Primary">
      @for (link of links; track link.href) {
        <a class="nav-link" [href]="link.href">{{ link.label }}</a>
      }
    </nav>

    <div class="actions">
      <button
        type="button"
        class="icon-button theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        [attr.title]="theme.theme() === 'dark' ? 'Light theme' : 'Dark theme'"
      >
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
        }
      </button>

      <a class="header-cta" [href]="'mailto:' + profile.email">Hire me</a>

      <button
        type="button"
        class="icon-button menu-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      >
        @if (menuOpen()) {
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        }
      </button>
    </div>
  </div>

  <div class="mobile-menu" id="mobile-menu" [class.is-open]="menuOpen()" [attr.inert]="menuOpen() ? null : ''">
    <nav class="mobile-nav" aria-label="Mobile">
      @for (link of links; track link.href; let i = $index) {
        <a class="mobile-link" [href]="link.href" (click)="closeMenu()">
          <span class="mobile-index">0{{ i + 1 }}</span>
          {{ link.label }}
        </a>
      }
      <a class="mobile-mail" [href]="'mailto:' + profile.email" (click)="closeMenu()">{{ profile.email }}</a>
    </nav>
  </div>
</header>
